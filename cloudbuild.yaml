options:
  logging: CLOUD_LOGGING_ONLY

steps:
# Paso 1: Construir la imagen de Docker
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '--build-arg', 'VITE_SUPABASE_URL=$_VITE_SUPABASE_URL',
    '--build-arg', 'VITE_SUPABASE_ANON_KEY=$_VITE_SUPABASE_ANON_KEY',
    '-t', 'gcr.io/$PROJECT_ID/app-rosario-taller:$COMMIT_SHA',
    '.'
  ]

# Paso 2: Empujar la imagen
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/app-rosario-taller:$COMMIT_SHA']

# Paso 3: Desplegar en Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args: [
    'run', 'deploy', 'app-rosario-taller',
    '--image', 'gcr.io/$PROJECT_ID/app-rosario-taller:$COMMIT_SHA',
    '--region', 'europe-west1',
    '--allow-unauthenticated'
  ]
